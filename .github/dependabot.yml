# Proposes updates as pull requests, which run rust.yml and image.yml like any other.
version: 2
updates:
  - package-ecosystem: docker
    directory: /wranglarr
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pinned to the commit of a branch named for the toolchain (# 1.89, # stable),
      # not a release: 1.89 is the minimum supported Rust (rust-version in
      # wranglarr/Cargo.toml), raised by hand with it, and stable picks up new Rust
      # releases at run time
      - dependency-name: dtolnay/rust-toolchain
  # tests/requirements.txt, compiled with hashes from tests/requirements.in
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /wranglarr
    schedule:
      interval: weekly
    groups:
      # one pull request for the routine minor and patch updates
      minor-and-patch:
        update-types: [minor, patch]
