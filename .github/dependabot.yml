# Proposes updates as pull requests, which run rust.yml and image.yml like any other.
version: 2
updates:
  - package-ecosystem: docker
    directory: /wranglarr
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # its "version" is the Rust toolchain: @1.89 is the minimum supported Rust
      # (rust-version in wranglarr/Cargo.toml), raised by hand with it, and
      # @stable needs no updates
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /wranglarr
    schedule:
      interval: weekly
    groups:
      # one pull request for the routine minor and patch updates
      minor-and-patch:
        update-types: [minor, patch]
