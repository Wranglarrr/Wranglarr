# Publishes the docs website (site/index.html, which renders README.md and wiki/)
# to GitHub Pages. Turn it on once: Settings -> Pages -> Source: GitHub Actions.
# A pull request builds the site without publishing it.
name: pages

on:
  push:
    branches: [main]
    paths: ["README.md", "ROADMAP.md", "wiki/**", "wranglarr/README.md", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/wranglarr
          cp site/index.html README.md ROADMAP.md _site/
          cp -r wiki _site/
          cp wranglarr/README.md _site/wranglarr/
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
