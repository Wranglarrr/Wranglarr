# wranglarr-gate (AuthTunnel): nginx in front of the apps' web UIs. Each request
# asks wranglarr whether the browser is signed in before it reaches the app.
# The per-app servers are generated by scripts/init.sh into
# appdata/gate/gate.conf.template and rendered into /tmp/gate at start.
# See wiki/App-Logins.md.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
# open app tabs keep websockets up for hours: don't let them hold a restart
worker_shutdown_timeout 5s;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    server_tokens off;
    access_log off;
    include /tmp/gate/*.conf;
}
