# Add-on to compose.vpn.yaml: Prowlarr joins the download clients in the tunnel.
#
#   COMPOSE_FILE=compose.yaml:compose.vpn.yaml:compose.vpn-prowlarr.yaml
#
# Prowlarr is the app that talks to the indexers.  With every indexer in
# Prowlarr, the arrs only talk to Prowlarr, the download clients and metadata
# servers, so they can stay outside the tunnel.  This holds only while:
#   - every indexer the arrs use comes from Prowlarr (none added to an arr by
#     hand or from wranglarr's Indexers page, which the arrs then query directly);
#   - Prowlarr's "Redirect" is off for each torrent indexer (with it on, an arr
#     fetches the .torrent from the indexer itself). Prowlarr always redirects
#     Usenet grabs, so the arrs fetch each .nzb from your own address; the
#     download itself still goes through the tunnel.
# wranglarr's VPN panel lists anything that breaks this.

services:
  vpn:
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    networks:
      arrs:
        aliases: [prowlarr]

  prowlarr:
    network_mode: "service:vpn"
    # !reset is written out per service: some Compose versions (2.35, for
    # one) drop it when it arrives through a YAML merge (<<), and refuse the file.
    networks: !reset []
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy
      postgres:
        condition: service_healthy

  wranglarr:
    environment:
      WRANGLARR_VPN_APPS: qbittorrent,sabnzbd,nzbget,prowlarr
