# VPN option: ONE WireGuard/OpenVPN tunnel (gluetun) that the apps share.
#
#   COMPOSE_FILE=compose.yaml:compose.vpn.yaml                            # download clients
#   COMPOSE_FILE=compose.yaml:compose.vpn.yaml:compose.vpn-prowlarr.yaml  # + Prowlarr
#   COMPOSE_FILE=compose.yaml:compose.vpn.yaml:compose.vpn-all.yaml       # + Prowlarr, the arrs, Bazarr
#   + the VPN_* / WIREGUARD_* block in .env
#
# This file is the tunnel and the download clients (qBittorrent, SABnzbd,
# NZBGet): the apps that talk to peers and news servers.  The two add-ons put
# more apps in the same tunnel.  See wiki/VPN-Shared-Tunnel.md for which to pick.
#
# How it works: the `vpn` service (qmcgaw/gluetun) owns the tunnel, a
# kill-switch firewall and a DNS-over-TLS resolver.  An app in the tunnel is
# attached to its network namespace (network_mode: service:vpn), so all its
# traffic leaves through the tunnel and nothing leaks if it drops.  Consequences:
#   - those apps' web UI ports are published on the vpn service instead;
#   - apps in the tunnel reach each other on localhost (same namespace);
#   - they still reach `postgres` and the apps outside the tunnel by name
#     (gluetun >= 3.41 forwards container-name lookups to Docker's DNS, and the
#     firewall lets the Docker network through);
#   - other containers reach them at vpn:<port>; the network aliases below keep
#     `http://qbittorrent:8090` etc. working for wranglarr and the arrs;
#   - if the vpn CONTAINER is recreated (not just the tunnel, which gluetun
#     heals itself), the apps in it must be restarted (docker compose restart ...).
# Only apps enabled in COMPOSE_PROFILES exist, so unused entries are harmless.
# Needs Docker Compose >= 2.24 for the !reset tags. They're written out per
# service rather than through a YAML anchor, which some versions mishandle.
#
# Docs: https://github.com/qdm12/gluetun-wiki  (providers/, options/)

services:
  vpn:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.3}
    container_name: arrs-vpn
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-custom}
      # wireguard (default) or openvpn.  Legacy OpenVPN works with every
      # named provider and with your own .ovpn (custom provider, see below).
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      # custom wireguard: either these, or a wg0.conf at appdata/vpn/wireguard/wg0.conf
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-}
      WIREGUARD_MTU: ${WIREGUARD_MTU:-1320}
      # named providers (mullvad, protonvpn, private internet access, ...)
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      SERVER_CITIES: ${SERVER_CITIES:-}
      SERVER_HOSTNAMES: ${SERVER_HOSTNAMES:-}
      SERVER_REGIONS: ${SERVER_REGIONS:-}        # PIA / ProtonVPN
      # provider login (OpenVPN always; PIA/ProtonVPN use it for WireGuard too)
      OPENVPN_USER: ${VPN_USER:-}
      OPENVPN_PASSWORD: ${VPN_PASSWORD:-}
      # openvpn: udp|tcp; custom .ovpn goes at appdata/vpn/custom.conf
      # (replace its `remote` hostname with an IP; certs next to it under /gluetun/)
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      OPENVPN_CUSTOM_CONFIG: ${OPENVPN_CUSTOM_CONFIG:-}
      OPENVPN_CIPHERS: ${OPENVPN_CIPHERS:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING_PROVIDER: ${VPN_PORT_FORWARDING_PROVIDER:-}
      # on = only servers that can forward a port (PIA, ProtonVPN P2P servers)
      PORT_FORWARD_ONLY: ${VPN_PORT_FORWARD_ONLY:-}
      # LAN subnets the apps in the tunnel may talk to directly (NAS, your download client on
      # another host, ...).  The Docker network itself is always allowed.
      FIREWALL_OUTBOUND_SUBNETS: ${VPN_LAN_NETWORK:-}
      DNS_UPSTREAM_RESOLVER_TYPE: ${DNS_UPSTREAM_RESOLVER_TYPE:-dot}
      DNS_UPSTREAM_RESOLVERS: ${DNS_UPSTREAM_RESOLVERS:-cloudflare}
      BLOCK_MALICIOUS: ${BLOCK_MALICIOUS:-on}
      HEALTH_VPN_DURATION_INITIAL: ${HEALTH_VPN_DURATION_INITIAL:-30s}
      UPDATER_PERIOD: ${UPDATER_PERIOD:-24h}
      # Control server (port 8000, docker network only): wranglarr reads VPN
      # status / public IP / forwarded port with this key.
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set GLUETUN_API_KEY in .env}"}'
      # With VPN_PORT_FORWARDING=on, push the forwarded port into qBittorrent and
      # bind it to the tunnel's interface. It needs "Bypass authentication for
      # clients on localhost" ticked in qBittorrent's Web UI options; without
      # qBittorrent (or with the box unticked) it fails and nothing else changes.
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8090/api/v2/app/setPreferences'
    # gluetun's own check, spelled out: Podman ignores the one in the image
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - ${APPDATA:-./appdata}/vpn:/gluetun
    ports:
      # The UIs of the apps in the tunnel, published through the vpn service.
      # host port == 8090: qBittorrent rejects requests whose Host port differs from its own
      - ${QBITTORRENT_PORT:-8090}:8090
      - ${SABNZBD_PORT:-8085}:8080
      - ${NZBGET_PORT:-6789}:6789
    networks:
      arrs:
        aliases: [qbittorrent, sabnzbd, nzbget]

  qbittorrent:
    network_mode: "service:vpn"
    # !reset is written out per service: some Compose versions (2.35, for
    # one) drop it when it arrives through a YAML merge (<<), and refuse the file.
    networks: !reset []
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy
  sabnzbd:
    network_mode: "service:vpn"
    networks: !reset []
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy
  nzbget:
    network_mode: "service:vpn"
    networks: !reset []
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy

  # tell wranglarr the VPN exists (enables its [vpn] section) and what is in it
  wranglarr:
    environment:
      WRANGLARR_ENABLED_APPS: ${COMPOSE_PROFILES:-radarr,sonarr,lidarr},vpn
      WRANGLARR_VPN_APPS: qbittorrent,sabnzbd,nzbget
